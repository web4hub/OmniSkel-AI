services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omniskel
      POSTGRES_PASSWORD: omniskel
      POSTGRES_DB: omniskel
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omniskel
      MINIO_ROOT_PASSWORD: omniskel-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://omniskel:omniskel@postgres:5432/omniskel
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: omniskel
      OBJECT_STORAGE_ACCESS_KEY: omniskel
      OBJECT_STORAGE_SECRET_KEY: omniskel-dev-password
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]

  model-service:
    build:
      context: ..
      dockerfile: ml/knee/Dockerfile
    ports: ["8001:8001"]

  clinical-viewer:
    build:
      context: ..
      dockerfile: apps/clinical-viewer/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  minio_data:
