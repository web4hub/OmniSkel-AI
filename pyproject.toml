[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "omniskel-ai"
version = "0.3.0"
description = "Multimodal musculoskeletal imaging intelligence research platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
pythonpath = [".", "src", "services/api"]
